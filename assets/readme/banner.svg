<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#17181a" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2231dd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2231dd"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#17181a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="#efefed"/>
  <rect width="1600" height="520" fill="url(#dots)"/>

  <!-- 左侧品牌 -->
  <rect x="72" y="62" width="74" height="74" rx="20" fill="#2231dd"/>
  <circle cx="98" cy="99" r="5.4" fill="#efefed"/>
  <circle cx="120" cy="99" r="5.4" fill="#efefed"/>

  <text x="72" y="248" fill="#17181a"
        font-family="Inter, PingFang SC, Helvetica Neue, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-5">观澜</text>
  <text x="76" y="298" fill="#2231dd"
        font-family="ui-monospace, Menlo, monospace"
        font-size="17" letter-spacing="7">GUANLAN · CREATOR DATA DESK</text>
  <text x="76" y="366" fill="#5b5d63"
        font-family="Inter, PingFang SC, Helvetica Neue, sans-serif"
        font-size="29" letter-spacing="-0.5">把四个平台的数据，变成下一步动作。</text>
  <text x="76" y="456" fill="#8e9097"
        font-family="ui-monospace, Menlo, monospace"
        font-size="15" letter-spacing="4">LOCAL-FIRST · READ-ONLY · MIT</text>

  <!-- 右侧数据卡 -->
  <g filter="url(#cardShadow)">
    <rect x="920" y="88" width="608" height="344" rx="28" fill="#ffffff"/>
    <rect x="920.5" y="88.5" width="607" height="343" rx="27.5" fill="none"
          stroke="#e7e7e3"/>
  </g>

  <text x="968" y="146" fill="#8e9097"
        font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">近 30 天内容</text>
  <text x="968" y="208" fill="#17181a"
        font-family="Inter, PingFang SC, sans-serif" font-size="52" font-weight="650"
        letter-spacing="-2">9</text>
  <text x="1004" y="206" fill="#5b5d63"
        font-family="Inter, PingFang SC, sans-serif" font-size="18">条</text>
  <!-- 第二列指标：x=1084，给左侧「近 30 天内容」留出约 17px 间距，避免文字重叠 -->
  <text x="1084" y="146" fill="#8e9097"
        font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">阅读 / 播放</text>
  <text x="1084" y="172" fill="#17181a"
        font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="600">84,700</text>

  <rect x="1328" y="124" width="152" height="34" rx="17" fill="#eef0ff"/>
  <circle cx="1348" cy="141" r="4" fill="#2231dd"/>
  <text x="1360" y="146" fill="#2231dd"
        font-family="Inter, PingFang SC, sans-serif" font-size="13">已排期 4 / 10</text>

  <!-- 柱状图 -->
  <g>
    <rect x="968" y="300" width="26" height="72" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1002" y="268" width="26" height="104" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1036" y="316" width="26" height="56" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1070" y="240" width="26" height="132" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1104" y="282" width="26" height="90" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1138" y="258" width="26" height="114" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1172" y="306" width="26" height="66" rx="4" fill="#17181a" opacity="0.88"/>
    <rect x="1206" y="224" width="26" height="148" rx="4" fill="url(#barBlue)"/>
    <rect x="1240" y="252" width="26" height="120" rx="4" fill="url(#barBlue)"/>
    <rect x="1274" y="288" width="26" height="84" rx="4" fill="url(#barBlue)"/>
    <rect x="1308" y="212" width="26" height="160" rx="4" fill="url(#barBlue)"/>
    <rect x="1342" y="246" width="26" height="126" rx="4" fill="#ff2442" opacity="0.85"/>
    <rect x="1376" y="272" width="26" height="100" rx="4" fill="#ff2442" opacity="0.85"/>
    <rect x="1410" y="232" width="26" height="140" rx="4" fill="#ff2442" opacity="0.85"/>
    <rect x="1444" y="260" width="26" height="112" rx="4" fill="#07c160" opacity="0.80"/>
    <rect x="968" y="376" width="502" height="1" fill="#e7e7e3"/>
  </g>

  <g>
    <rect x="968" y="398" width="128" height="26" rx="13" fill="#f5f5f3"/>
    <circle cx="984" cy="411" r="4" fill="#2231dd"/>
    <text x="996" y="416" fill="#5b5d63"
          font-family="Inter, PingFang SC, sans-serif" font-size="11.5">11/17 周二 20:00</text>
  </g>
</svg>
